name: CI - Build and Push Docker Images

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build & Push Frontend Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/phishing-frontend ./frontend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/phishing-frontend

    - name: Build & Push Backend Image
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/phishing-backend ./backend
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/phishing-backend

